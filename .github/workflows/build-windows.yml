name: Build Tom&Grace Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check server JavaScript syntax
        run: node --check server.js
      - name: Check browser JavaScript syntax
        shell: bash
        run: node --input-type=module --check < public/app.js
      - name: Run multiplayer smoke tests
        run: npm run test:smoke
      - name: Build Windows installer
        run: npm run build:win -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: TomAndGrace-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
